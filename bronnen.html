<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaboBronnenBank - De BronnenBank</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, rgba(88, 28, 92, 0.95) 0%, rgba(45, 12, 48, 0.98) 100%), polygon(0 0, 100% 0, 100% 100%, 0 100%);
            background-color: #3f1543;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

            body::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 40%), linear-gradient(60deg, transparent 40%, rgba(0, 0, 0, 0.15) 40%, rgba(0, 0, 0, 0.15) 70%, transparent 70%);
                pointer-events: none;
                z-index: 0;
            }

        header {
            padding: 35px 50px;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

            .logo:hover {
                opacity: 0.9;
            }

        .main-container {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 0 30px 60px 30px;
            position: relative;
            z-index: 1;
        }

        .search-filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
            background-color: #ffffff;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 5px 25px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

            .search-box label {
                font-size: 1.3rem;
                font-weight: bold;
                color: #350d36;
                margin-right: 15px;
                user-select: none;
            }

            .search-box input {
                border: none;
                outline: none;
                font-size: 1.1rem;
                width: 100%;
                color: #350d36;
                background: transparent;
            }

        .search-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #350d36;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .filter-btn, .add-btn {
            background-color: #ffffff;
            color: #350d36;
            border: none;
            border-radius: 30px;
            padding: 14px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            white-space: nowrap;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            transition: background-color 0.2s, transform 0.2s;
        }

            .filter-btn:hover, .add-btn:hover {
                background-color: #f0f0f0;
                transform: translateY(-2px);
            }

        .filter-panel {
            display: none;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            gap: 30px;
        }

            .filter-panel.open {
                display: flex;
                flex-wrap: wrap;
            }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            .filter-group label {
                font-weight: bold;
                font-size: 1rem;
            }

            .filter-group select {
                padding: 10px 15px;
                border-radius: 12px;
                border: none;
                font-size: 1rem;
                color: #350d36;
                outline: none;
            }

        .bronnen-wrapper {
            position: relative;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 15px;
        }

            .bronnen-wrapper::-webkit-scrollbar {
                width: 12px;
            }

            .bronnen-wrapper::-webkit-scrollbar-track {
                background: rgba(255, 255, 255, 0.2);
                border-radius: 10px;
            }

            .bronnen-wrapper::-webkit-scrollbar-thumb {
                background: #ffffff;
                border-radius: 10px;
            }

        .bron-card {
            background-color: #ffffff;
            border-radius: 35px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }

        .vak-pill {
            background-color: #f0e6f2;
            color: #350d36;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 14px 40px;
            border-radius: 25px;
            min-width: 180px;
            text-align: center;
        }

        .bron-naam {
            background-color: #f0e6f2;
            color: #350d36;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 30px;
            border-radius: 25px;
            flex: 1;
        }

        .loading-text {
            text-align: center;
            font-size: 1.3rem;
            padding: 30px;
        }

        @media (max-width: 768px) {
            .search-filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-btn, .add-btn {
                text-align: center;
            }

            .bron-card {
                flex-direction: column;
                align-items: stretch;
            }

            .vak-pill {
                min-width: auto;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo" title="Ga terug naar Home">PaboBronnenBank</a>
    </header>

    <div class="main-container">

        <div class="search-filter-bar">
            <div class="search-box">
                <label for="searchInput">Zoeken</label>
                <svg class="search-icon" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="22" y2="22"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="" aria-label="Zoek naar een bron of inhoud">
            </div>

            <button class="filter-btn" id="filterToggleBtn">Filters</button>
            <a href="nieuwe-bron.html" class="add-btn">+ Voeg bron toe</a>
        </div>

        <div class="filter-panel" id="filterPanel">
            <div class="filter-group">
                <label for="filterVak">Filter op Vak:</label>
                <select id="filterVak">
                    <option value="alle">Alle vakken</option>
                    <option value="Rekenen">Rekenen</option>
                    <option value="Engels">Engels</option>
                    <option value="Nederlands">Nederlands</option>
                    <option value="Pedagogiek">Pedagogiek</option>
                    <option value="Geschiedenis">Geschiedenis</option>
                    <option value="Aardrijkskunde">Aardrijkskunde</option>
                    <option value="Natuur & Techniek">Natuur & Techniek</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filterBladzijde">Bladzijde vermeld:</label>
                <select id="filterBladzijde">
                    <option value="alle">Alle</option>
                    <option value="Ja">Ja</option>
                    <option value="Nee">Nee</option>
                </select>
            </div>
        </div>

        <div class="bronnen-wrapper" id="bronnenLijst">
            <div class="loading-text">Bronnen laden uit de Google Spreadsheet...</div>
        </div>

    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHS9wIOHysBRvOSLE8LC-cVfUsrlFtPKSj11UKAkwiRMidskN0B50KU19VhRJPhlTqsg/exec";

        const filterToggleBtn = document.getElementById('filterToggleBtn');
        const filterPanel = document.getElementById('filterPanel');

        filterToggleBtn.addEventListener('click', () => {
            filterPanel.classList.toggle('open');
        });

        let bronnenData = [];

        // Ophalen van bronnen via Google Apps Script (GET)
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                bronnenData = data;
                renderBronnen(bronnenData);
            })
            .catch(err => {
                document.getElementById('bronnenLijst').innerHTML = `<div class="loading-text">Er is een fout opgetreden bij het laden van de bronnen.</div>`;
                console.error('Fout bij ophalen bronnen:', err);
            });

        function renderBronnen(lijst) {
            const container = document.getElementById('bronnenLijst');
            if (lijst.length === 0) {
                container.innerHTML = `<div class="loading-text">Geen bronnen gevonden.</div>`;
                return;
            }

            container.innerHTML = lijst.map(item => {
                const blzInfo = item.blzNmr ? ` (p. ${item.blzNmr})` : '';
                const volledigeBron = `${item.apaLiteratuurlijst}${blzInfo}`;
                return `
              <div class="bron-card" data-vak="${item.vak}" data-bladzijde="${item.bladzijdeAanwezig}">
                <div class="vak-pill">${item.vak || 'Algemeen'}</div>
                <div class="bron-naam">${volledigeBron}</div>
              </div>
            `;
            }).join('');
        }

        // Filter- en zoeklogica
        const searchInput = document.getElementById('searchInput');
        const filterVak = document.getElementById('filterVak');
        const filterBladzijde = document.getElementById('filterBladzijde');

        function pasFiltersToe() {
            const zoekTerm = searchInput.value.toLowerCase();
            const gekozenVak = filterVak.value;
            const gekozenBladzijde = filterBladzijde.value;

            const gefilterd = bronnenData.filter(item => {
                const vakMatch = (item.vak || '').toLowerCase().includes(zoekTerm);
                const naamMatch = (item.naamBron || '').toLowerCase().includes(zoekTerm);
                const apaMatch = (item.apaLiteratuurlijst || '').toLowerCase().includes(zoekTerm);
                const inhoudMatch = (item.inhoud || '').toLowerCase().includes(zoekTerm);

                const matchesSearch = vakMatch || naamMatch || apaMatch || inhoudMatch;
                const matchesVak = gekozenVak === 'alle' || item.vak === gekozenVak;
                const matchesBladzijde = gekozenBladzijde === 'alle' || item.bladzijdeAanwezig === gekozenBladzijde;

                return matchesSearch && matchesVak && matchesBladzijde;
            });

            renderBronnen(gefilterd);
        }

        searchInput.addEventListener('input', pasFiltersToe);
        filterVak.addEventListener('change', pasFiltersToe);
        filterBladzijde.addEventListener('change', pasFiltersToe);
    </script>

</body>
</html>
