<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaboBronnenBank - Home</title>
  <style>
    :root {
      --primary: #0056b3;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #222222;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }

    /* Navigatiemenu */
    nav {
      background-color: var(--primary);
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    nav a:hover, nav a.active {
      text-decoration: underline;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    main {
      background-color: var(--card);
      padding: 35px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    h1 {
      color: var(--primary);
      font-size: 2rem;
      margin-top: 0;
    }

    .btn-group {
      margin-top: 30px;
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 5px;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #003d80;
    }

    .btn-secondary {
      background-color: #6c757d;
    }

    .btn-secondary:hover {
      background-color: #545b62;
    }
  </style>
</head>
<body>

  <!-- Navigatiebalk -->
  <nav>
    <a href="index.html" class="active">Home</a>
    <a href="bronnen.html">De BronnenBank</a>
    <a href="nieuwe-bron.html">Nieuwe Bronnen</a>
  </nav>

  <div class="container">
    <main>
      <h1>Welkom bij de PaboBronnenBank</h1>
      <p>Het centrale platform voor leerkrachten en PABO-studenten om snel lesmateriaal, handige links en inspiratie voor de basisschool te delen en te vinden.</p>
      
      <div class="btn-group">
        <a href="bronnen.html" class="btn">Zoek in de BronnenBank</a>
        <a href="nieuwe-bron.html" class="btn btn-secondary">Voeg een Bron Toe</a>
      </div>
    </main>
  </div>

</body>
</html>
